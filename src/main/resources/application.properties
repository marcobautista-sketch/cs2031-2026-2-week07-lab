spring.application.name=flyaway
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flyaway}
spring.datasource.username=${DB_USER:flyaway}
spring.datasource.password=${DB_PASSWORD:flyaway}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-please-32-bytes-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.email.output-dir=${EMAIL_OUTPUT_DIR:emails}
